      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ================== FULL GRAPHICS (0.0s -> 3.5s) ==================
        tl.fromTo(
          "#s2f-header",
          { y: -18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" },
          0.0
        );
        tl.fromTo(
          "#s2f-hero-card",
          { scale: 0.94, borderRadius: "44px", opacity: 0 },
          { scale: 1, borderRadius: "28px", opacity: 1, duration: 0.25, ease: "back.out(1.4)" },
          0.08
        );
        tl.fromTo(
          "#s2f-bento-strip",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" },
          0.2
        );

        const speedProxy = { v: 0 };
        const fullStatEl = document.getElementById("s2f-big-stat");
        tl.to(
          speedProxy,
          {
            v: 30,
            duration: 0.7,
            ease: "power3.out",
            onUpdate: function () {
              fullStatEl.textContent = "+" + Math.round(speedProxy.v) + "%";
            },
          },
          0.14
        );

        tl.fromTo("#s2f-fill-prev", { scaleX: 0 }, { scaleX: 0.76923, duration: 0.55, ease: "power2.out" }, 0.25);
        tl.fromTo("#s2f-fill-fable-base", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.3);
        tl.fromTo("#s2f-fill-fable-gain", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.9);
        tl.fromTo("#s2f-ref-line", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.75);

        // ================== CORTE LIMPO PARA SPLIT (t = 3.5s) ==================
        tl.set("#s2-tab-pill", { x: 320 }, 0);
        tl.set("#s2-full-view", { opacity: 0 }, 3.5);
        tl.set("#s2-split-view", { opacity: 1 }, 3.5);

        // Cursor em split navega da aba CONTEXTO (3.5s) para CUSTO (4.2s)
        tl.fromTo(
          "#s2-cursor",
          { x: 326, y: 18, opacity: 0 },
          { x: 326, y: 0, opacity: 1, duration: 0.24, ease: "power2.out" },
          3.65
        );
        tl.to("#s2-cursor", { x: 646, duration: 0.32, ease: "power2.inOut" }, 3.9);
        tl.to("#s2-cursor", { scale: 0.84, duration: 0.08 }, 4.22);
        tl.to("#s2-cursor", { scale: 1, duration: 0.14, ease: "back.out(2)" }, 4.3);
        tl.to("#s2-tab-pill", { x: 640, scaleX: 1.07, duration: 0.18, ease: "power2.in" }, 4.22);
        tl.to("#s2-tab-pill", { scaleX: 1, duration: 0.22, ease: "back.out(1.7)" }, 4.4);
        tl.to("#s2-tab-2", { color: "#e2e8f0", duration: 0.1 }, 4.25);
        tl.to("#s2-tab-3", { color: "#09111e", duration: 0.12 }, 4.3);
        tl.to("#s2-detail-2", { opacity: 0, y: -10, duration: 0.14, ease: "power2.in" }, 4.23);
        tl.fromTo("#s2-detail-3", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 4.35);
        tl.to("#s2-morph-card", { borderRadius: "32px", scale: 1.012, duration: 0.16 }, 4.26);
        tl.to("#s2-morph-card", { borderRadius: "26px", scale: 1, duration: 0.24 }, 4.44);
        tl.to("#s2-cursor", { opacity: 0, duration: 0.22 }, 4.95);

        // Pulso sutil determinístico no halo
        tl.to(
          "#s2-halo",
          {
            scale: 1.07,
            duration: 1.4,
            ease: "sine.inOut",
            yoyo: true,
            repeat: Math.max(0, Math.floor(5.6 / 1.4) - 1),
          },
          0.0
        );

        window.__timelines["scene-2-dados"] = tl;
      </script>
