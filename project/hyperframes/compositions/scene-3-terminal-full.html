<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cena 3 — Terminal MAI Code 2 em tela cheia 12.0–14.5s (full_graphics)</title>
  </head>
  <body>
    <template id="scene-3-terminal-full-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          font-family: Inter, Outfit, system-ui, sans-serif;
          color: #111318;
        }
        /* Full-bleed child (never the root) — hyperframes-core frame compositing */
        #t3-bg {
          position: absolute;
          inset: 0;
          background: #f3f1ec;
          overflow: hidden;
        }
        #t3-dot-field {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(17, 19, 24, 0.11) 1.5px, transparent 1.5px);
          background-size: 32px 32px;
        }
        #t3-frame-rule {
          position: absolute;
          inset: 22px;
          border: 2px solid rgba(17, 19, 24, 0.16);
          border-radius: 28px;
        }
        /* Conteúdo acima das legendas de full_graphics (y: 1390..1490) */
        #t3-stage {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
          padding: 150px 60px 0 60px;
          display: flex;
          flex-direction: column;
          gap: 26px;
        }
        #t3-head {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        #t3-kicker {
          align-self: flex-start;
          padding: 9px 20px;
          border-radius: 10px;
          background: #111318;
          color: #f3f1ec;
          font-family: "JetBrains Mono", monospace;
          font-size: 21px;
          font-weight: 700;
          letter-spacing: 0.06em;
        }
        #t3-title {
          margin: 0;
          font-family: Outfit, sans-serif;
          font-size: 76px;
          font-weight: 900;
          line-height: 1;
          color: #111318;
        }
        #t3-subtitle {
          font-family: "JetBrains Mono", monospace;
          font-size: 24px;
          font-weight: 700;
          color: #b8330a;
        }
        #t3-kpi-row {
          display: flex;
          gap: 22px;
        }
        .t3-kpi {
          flex: 1;
          border-radius: 22px;
          padding: 22px 28px;
          border: 3px solid #111318;
          display: flex;
          align-items: baseline;
          gap: 14px;
        }
        #t3-kpi-left {
          background: #111318;
          color: #f3f1ec;
        }
        #t3-kpi-right {
          background: #c83e12;
          color: #ffffff;
        }
        .t3-kpi-num {
          font-family: Outfit, sans-serif;
          font-size: 78px;
          font-weight: 900;
          line-height: 1;
        }
        .t3-kpi-lbl {
          font-family: "JetBrains Mono", monospace;
          font-size: 21px;
          font-weight: 700;
          line-height: 1.2;
        }
        #t3-terminal {
          position: relative;
          border-radius: 26px;
          background: #0d0f14;
          border: 3px solid #111318;
          box-shadow: 0 26px 54px rgba(17, 19, 24, 0.22);
          padding: 0 0 30px 0;
          overflow: hidden;
        }
        #t3-term-bar {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 18px 26px;
          background: #171a21;
          border-bottom: 2px solid #262a33;
        }
        .t3-dot {
          width: 16px;
          height: 16px;
          border-radius: 50%;
        }
        #t3-dot-1 { background: #ef4444; }
        #t3-dot-2 { background: #f59e0b; }
        #t3-dot-3 { background: #22c55e; }
        #t3-term-path {
          margin-left: 12px;
          font-family: "JetBrains Mono", monospace;
          font-size: 20px;
          font-weight: 700;
          color: #7d8aa3;
        }
        #t3-prompt-line {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 32px 30px 22px 30px;
          font-family: "JetBrains Mono", monospace;
        }
        #t3-prompt-sign {
          font-size: 44px;
          font-weight: 700;
          color: #4ade80;
        }
        #t3-prompt-text {
          font-size: 44px;
          font-weight: 700;
          color: #ffffff;
          letter-spacing: -0.01em;
        }
        #t3-caret {
          display: block;
          width: 18px;
          height: 46px;
          background: #c83e12;
          border-radius: 3px;
        }
        #t3-log {
          display: flex;
          flex-direction: column;
          gap: 16px;
          padding: 6px 30px 26px 30px;
          font-family: "JetBrains Mono", monospace;
          font-size: 24px;
          font-weight: 500;
          color: #cbd5e1;
        }
        #t3-log-4 {
          color: #4ade80;
          font-weight: 700;
        }
        #t3-progress-track {
          display: block;
          margin: 0 30px;
          width: calc(100% - 60px);
          height: 16px;
          border-radius: 999px;
          background: #262a33;
          overflow: hidden;
        }
        #t3-progress-fill {
          display: block;
          width: 100%;
          height: 16px;
          border-radius: 999px;
          background: #c83e12;
          transform-origin: left center;
        }
        /* Painel de patch abaixo da zona de legendas (y: 1530..1840) */
        #t3-patch { position: absolute; left: 60px; right: 60px; top: 1530px; border-radius: 22px; border: 3px solid #111318; background: #ffffff; padding: 22px 28px; display: flex; flex-direction: column; gap: 14px; }
        #t3-patch-title { font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 700; letter-spacing: 0.08em; color: #b8330a; }
        .t3-file-row { display: flex; align-items: center; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; color: #111318; padding-bottom: 10px; border-bottom: 2px solid rgba(17, 19, 24, 0.1); }
        .t3-file-row:last-child { border-bottom: none; padding-bottom: 0; }
        .t3-file-plus { color: #15803d; }
      </style>

      <div id="root" data-composition-id="scene-3-terminal-full" data-width="1080" data-height="1920">
        <div id="t3-bg" data-layout-ignore>
          <div id="t3-dot-field" data-layout-ignore></div>
          <div id="t3-frame-rule" data-layout-ignore></div>
        </div>

        <div id="t3-stage">
          <div id="t3-head">
            <div id="t3-kicker">NOTÍCIA 02 // MICROSOFT IGNITE</div>
            <h1 id="t3-title">MAI CODE 2</h1>
            <div id="t3-subtitle">AGENTE AUTÔNOMO NO GITHUB COPILOT</div>
          </div>

          <div id="t3-kpi-row">
            <div id="t3-kpi-left" class="t3-kpi">
              <div class="t3-kpi-num">96%</div>
              <div class="t3-kpi-lbl">FORÇA<br />EM CÓDIGO</div>
            </div>
            <div id="t3-kpi-right" class="t3-kpi">
              <div class="t3-kpi-num">5%</div>
              <div class="t3-kpi-lbl">DO CUSTO<br />PROMO</div>
            </div>
          </div>

          <div id="t3-terminal">
            <div id="t3-term-bar">
              <span id="t3-dot-1" class="t3-dot t3-dot-live"></span>
              <span id="t3-dot-2" class="t3-dot t3-dot-live"></span>
              <span id="t3-dot-3" class="t3-dot t3-dot-live"></span>
              <span id="t3-term-path">~/projetos/checkout-api</span>
            </div>

            <div id="t3-prompt-line">
              <span id="t3-prompt-sign">$</span>
              <span id="t3-prompt-text">mai-code fix --repo</span>
              <span id="t3-caret"></span>
            </div>

            <div id="t3-log">
              <div id="t3-log-1">→ Lendo 14 arquivos do workspace...</div>
              <div id="t3-log-2">→ Plano de patch multi-arquivo gerado</div>
              <div id="t3-log-3">→ Aplicando 3 edições e rodando testes</div>
              <div id="t3-log-4">✓ 14/14 TESTES PASSANDO</div>
            </div>

            <div id="t3-progress-track">
              <div id="t3-progress-fill"></div>
            </div>
          </div>

        </div>

        <div id="t3-patch">
          <div id="t3-patch-title">PATCH APLICADO · PRONTO PARA REVISÃO</div>
          <div id="t3-file-1" class="t3-file-row"><span>src/agent/loop.ts</span><span class="t3-file-plus">+128</span></div>
          <div id="t3-file-2" class="t3-file-row"><span>src/tools/exec.ts</span><span class="t3-file-plus">+42</span></div>
          <div id="t3-file-3" class="t3-file-row"><span>tests/agent.test.ts</span><span class="t3-file-plus">+87</span></div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* Entrada do cabeçalho e KPIs (trecho de 2.5s: 12.0 -> 14.5 global) */
        tl.fromTo(
          "#t3-head",
          { y: -22, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.22, ease: "power3.out" },
          0.0
        );
        tl.fromTo(
          "#t3-kpi-left",
          { y: 22, opacity: 0, scale: 0.94 },
          { y: 0, opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.5)" },
          0.16
        );
        tl.fromTo(
          "#t3-kpi-right",
          { y: 22, opacity: 0, scale: 0.94 },
          { y: 0, opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.5)" },
          0.3
        );

        /* Terminal em tela cheia: shell entra, comando aparece, logs correm */
        tl.fromTo(
          "#t3-terminal",
          { y: 40, opacity: 0, scale: 0.97 },
          { y: 0, opacity: 1, scale: 1, duration: 0.28, ease: "power2.out" },
          0.08
        );
        tl.fromTo(
          "#t3-prompt-line",
          { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: 0.2, ease: "power2.out" },
          0.32
        );
        tl.fromTo(
          "#t3-log-1",
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.18 },
          0.6
        );
        tl.fromTo(
          "#t3-log-2",
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.18 },
          0.9
        );
        tl.fromTo(
          "#t3-log-3",
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.18 },
          1.2
        );
        tl.fromTo(
          "#t3-progress-fill",
          { scaleX: 0.05 },
          { scaleX: 1, duration: 1.0, ease: "power2.inOut" },
          0.6
        );
        tl.fromTo(
          "#t3-log-4",
          { opacity: 0, y: 10, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "back.out(1.6)" },
          1.72
        );
        tl.fromTo(
          "#t3-patch",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" },
          1.62
        );
        ["#t3-file-1", "#t3-file-2", "#t3-file-3"].forEach(function (sel, idx) {
          tl.fromTo(
            sel,
            { opacity: 0, x: -12 },
            { opacity: 1, x: 0, duration: 0.18, ease: "power2.out" },
            1.78 + idx * 0.14
          );
        });

        /* Cursor piscando com contagem finita (sem repeat: -1) */
        tl.to("#t3-caret", { opacity: 0.15, duration: 0.26, yoyo: true, repeat: 7 }, 0.5);

        window.__timelines["scene-3-terminal-full"] = tl;
      </script>
    </template>
  </body>
</html>
