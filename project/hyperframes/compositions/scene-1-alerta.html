          0.0

        tl.fromTo(

          { x: 0, opacity: 1, duration: 0.2, ease: "power4.out" },

          { y: 20, opacity: 0, scale: 0.97 },
          { y: 0, opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" },

          { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(1.8)" },

            duration: 0.25,
            ease: "steps(1)",
            yoyo: true,
            repeat: Math.max(0, Math.floor(3.1 / 0.25) - 1),

          0.1
        );

          const len = p && p.getTotalLength ? p.getTotalLength() : 300;
          gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
          tl.fromTo(
            p,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" },
            0.26 + idx * 0.12
          );
        });
